name: Temporary Sports Encyclopedia v1.4.0 APK Build
run-name: Sports Encyclopedia v1.4.0 APK

on:
  push:
    branches:
      - temp-sports-encyclopedia-v140-apk
    paths:
      - 'sports-apk-build/**'
      - '.github/workflows/temp-sports-encyclopedia-v130.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source dist diagnostics
          cat sports-apk-build/chunk*.txt > work/project.b64
          test "$(wc -c < work/project.b64)" = "50284"
          echo "02b0e39004d21f6b6d2e4d42038a5c0f2f8190b9140a0686a31c4e7a38c2a88d  work/project.b64" | sha256sum -c -
          base64 -d work/project.b64 > work/project.zip
          echo "13b1e569850962da1a78da32089699375d1d38827ae9aa94b69b6fc7b3900764  work/project.zip" | sha256sum -c -
          unzip -t work/project.zip >/dev/null
          unzip -q work/project.zip -d work/source
          ROOT="$GITHUB_WORKSPACE/work/source/sportsbuild"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/java/com/aboryan/sportsencyclopedia/MainActivity.kt"

      - name: Apply mobile RTL layout fix
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          patch -p1 < "$GITHUB_WORKSPACE/sports-apk-build/mobile-v131.patch"
          grep -q "Gravity.RIGHT" app/src/main/java/com/aboryan/sportsencyclopedia/MainActivity.kt
          grep -q "versionCode 6" app/build.gradle
          grep -q "versionName '1.3.1'" app/build.gradle

      - name: Apply v1.4.0 encyclopedia update
        shell: bash
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE"/sports-apk-build/v140safe/chunk*.patch > /tmp/mobile-v140.patch
          test "$(wc -c < /tmp/mobile-v140.patch)" = "60009"
          echo "df671e19dffba0e3d48e70da2e85db0f710a43a93d573f361cda00ce785e660d  /tmp/mobile-v140.patch" | sha256sum -c -
          cd "$PROJECT_ROOT"
          patch -p2 < /tmp/mobile-v140.patch
          grep -q "versionCode 7" app/build.gradle
          grep -q "versionName '1.4.0'" app/build.gradle
          grep -q 'private fun titleListRow' app/src/main/java/com/aboryan/sportsencyclopedia/MainActivity.kt
          grep -q 'private fun articleBodySections' app/src/main/java/com/aboryan/sportsencyclopedia/MainActivity.kt
          grep -q 'sports_encyclopedia.db", null, 3' app/src/main/java/com/aboryan/sportsencyclopedia/SportsDatabase.kt
          test "$(grep -c '^        SeedArticle(' app/src/main/java/com/aboryan/sportsencyclopedia/SeedContent.kt)" = "98"
          grep -q 'https://ketabonline.com/ar/books/26351' app/src/main/java/com/aboryan/sportsencyclopedia/SeedContent.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore Cairo font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_ROOT/app/src/main/res/font"
          curl -fL --retry 3 -o "$PROJECT_ROOT/app/src/main/res/font/cairo.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"
          test "$(wc -c < "$PROJECT_ROOT/app/src/main/res/font/cairo.ttf")" -gt 100000
          sed -i 's#<item name="android:fontFamily">sans-serif</item>#<item name="android:fontFamily">@font/cairo</item>#g' "$PROJECT_ROOT/app/src/main/res/values/styles.xml"
          grep -q '@font/cairo' "$PROJECT_ROOT/app/src/main/res/values/styles.xml"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/gradle-build.log"

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee dist/Sports-Encyclopedia-v1.4.0-SIGNING.txt
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/aapt" dump badging "$APK" | tee dist/Sports-Encyclopedia-v1.4.0-BADGING.txt
          grep -q "package: name='com.aboryan.sportsencyclopedia'" dist/Sports-Encyclopedia-v1.4.0-BADGING.txt
          grep -q "versionCode='7'" dist/Sports-Encyclopedia-v1.4.0-BADGING.txt
          grep -q "versionName='1.4.0'" dist/Sports-Encyclopedia-v1.4.0-BADGING.txt
          cp "$APK" dist/Sports-Encyclopedia-v1.4.0.apk
          sha256sum dist/Sports-Encyclopedia-v1.4.0.apk | tee dist/Sports-Encyclopedia-v1.4.0-SHA256.txt
          ls -lh dist/Sports-Encyclopedia-v1.4.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sports-Encyclopedia-v1.4.0
          path: |
            dist/Sports-Encyclopedia-v1.4.0.apk
            dist/Sports-Encyclopedia-v1.4.0-SIGNING.txt
            dist/Sports-Encyclopedia-v1.4.0-BADGING.txt
            dist/Sports-Encyclopedia-v1.4.0-SHA256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Sports-Encyclopedia-v1.4.0-log
          path: diagnostics/*
          if-no-files-found: warn
          retention-days: 7
