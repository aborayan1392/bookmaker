name: Build APKForge Java Pro

on:
  push:
    branches:
      - apkforge-v2-build-20260827
    paths:
      - .github/workflows/build-apkforge-java-pro.yml
      - apkforge-java-pro/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-34' \
            'platforms;android-35' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/apkforge-java-pro
          mkdir -p /tmp/apkforge-java-pro
          base64 -d apkforge-java-pro/source.zip.b64 > /tmp/apkforge-java-pro/source.zip
          echo '67dca287a5fee4f005c3ae6ba1fa384de4cb19a2283edb44a9da6312bf4bd4da  /tmp/apkforge-java-pro/source.zip' | sha256sum -c -
          unzip -q /tmp/apkforge-java-pro/source.zip -d /tmp/apkforge-java-pro
          test -f /tmp/apkforge-java-pro/APKForge-Java-Pro/app/build.gradle

      - name: Build debug APK
        working-directory: /tmp/apkforge-java-pro/APKForge-Java-Pro
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/apkforge-java-pro/APKForge-Java-Pro/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" "$GITHUB_WORKSPACE/APKForge-Java-Pro-v1.0.0.apk"
          sha256sum "$GITHUB_WORKSPACE/APKForge-Java-Pro-v1.0.0.apk" | tee "$GITHUB_WORKSPACE/APKForge-Java-Pro-v1.0.0-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APKForge-Java-Pro-v1.0.0
          path: |
            APKForge-Java-Pro-v1.0.0.apk
            APKForge-Java-Pro-v1.0.0-SHA256.txt
          if-no-files-found: error
